name: narration

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated slide numbers to (re)generate; empty = all missing'
        required: false
        default: ''
      model:
        description: 'ElevenLabs model id'
        required: false
        default: 'eleven_v4'

permissions:
  contents: write
  pull-requests: write

jobs:
  narration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install git-lfs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs
          git lfs install

      - name: Generate narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          MODEL: ${{ inputs.model }}
          ONLY: ${{ inputs.only }}
        run: |
          args=(--model "$MODEL")
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          python3 deck/make-audio.py "${args[@]}"

      - name: Require 40 mp3 files
        run: |
          n=$(ls deck/audio/*.mp3 2>/dev/null | wc -l)
          echo "mp3 files: $n"
          if [ "$n" -lt 40 ]; then
            echo "::error::expected 40 mp3 files, found $n"
            exit 1
          fi

      - name: Commit to narration-${{ github.run_number }}
        env:
          BRANCH: narration-${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add deck/audio/*.mp3 deck/script.json
          git commit -m "deck: ElevenLabs narration (40 slides)"
          git push -u origin "$BRANCH"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: narration-${{ github.run_number }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "deck: ElevenLabs narration (40 slides)" \
            --body "Generated by the narration workflow (run ${{ github.run_number }}). Adds deck/audio/*.mp3 (Git LFS) and sets \"audio\": true in deck/script.json."
